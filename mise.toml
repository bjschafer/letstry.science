# Single source of truth for the Zola version, locally and on Cloudflare Pages.
# Pages build settings (dashboard, production + preview):
#   UNSTABLE_PRE_BUILD: curl -fsSL https://mise.run | sh
#                       && MISE_CEILING_PATHS="$HOME" "$HOME/.local/bin/mise" install -y
#   Build command:      MISE_CEILING_PATHS="$HOME" "$HOME/.local/bin/mise" exec -- zola build ...
# MISE_CEILING_PATHS is mandatory: the build image ships /opt/buildhome/.tool-versions
# (go, hugo, node, python, ruby). Without the ceiling, mise walks up into $HOME, adopts
# all of them, and the resulting api.github.com storm 403s on the shared build IP.
# Bumping the pin below is all that is required; nothing to change in Cloudflare.
[tools]
zola = "0.23"

[tasks.serve]
description = "Run development server"
usage = '''
flag "--drafts" help="Include drafts when loading the site" negate="--no-drafts" default=#true
flag "--open" help="Open site in the default browser" negate="--no-open" default=#true
'''
run = '''
args=()
if [ "${usage_drafts:-false}" = "true" ]; then
  args+=(--drafts)
fi
if [ "${usage_open:-false}" = "true" ]; then
  args+=(--open)
fi
zola serve "${args[@]}"
'''

[tasks.check]
description = "Check site without building"
run = "zola check"

[tasks.build]
description = "Compile static site"
run = "zola build"
